<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banking API — Panel</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- ===== PANTALLA DE LOGIN ===== -->
  <section id="loginScreen" class="screen">
    <div class="login-card">
      <h1>🏦 Banking API</h1>
      <p class="subtitle">Inicia sesión para continuar</p>
      <form id="loginForm">
        <label>Usuario
          <input type="text" id="loginUsername" placeholder="admin" required />
        </label>
        <label>Contraseña
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </label>
        <button type="submit">Iniciar sesión</button>
      </form>
      <p id="loginError" class="error-text"></p>
    </div>
  </section>

  <!-- ===== APP PRINCIPAL ===== -->
  <section id="appScreen" class="screen hidden">
    <header class="topbar">
      <div class="brand">🏦 Banking API</div>
      <div class="user-info">
        <span id="userLabel"></span>
        <button id="logoutBtn" class="btn-ghost">Salir</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="dashboard">Mi cuenta</button>
      <button class="tab-btn" data-tab="transfer">Transferir</button>
      <button class="tab-btn admin-only hidden" data-tab="admin">Administración</button>
    </nav>

    <main class="content">

      <!-- Dashboard -->
      <div id="tab-dashboard" class="tab-panel">
        <div class="card balance-card">
          <p class="balance-label">Saldo disponible</p>
          <p class="balance-amount" id="myBalance">—</p>
          <button id="refreshBalanceBtn" class="btn-secondary">Actualizar saldo</button>
        </div>
        <div class="card">
          <h3>Perfil</h3>
          <p><strong>Usuario:</strong> <span id="profileUsername">—</span></p>
          <p><strong>Rol:</strong> <span id="profileRole">—</span></p>
        </div>
      </div>

      <!-- Transferencias -->
      <div id="tab-transfer" class="tab-panel hidden">
        <div class="card">
          <h3>Nueva transferencia</h3>
          <form id="transferForm">
            <label>Desde (cuenta origen)
              <input type="text" id="fromUsername" required />
            </label>
            <label>Hacia (cuenta destino)
              <input type="text" id="toUsername" required placeholder="username destino" />
            </label>
            <label>Monto
              <input type="number" id="transferAmount" min="0.01" step="0.01" required />
            </label>
            <button type="submit">Transferir</button>
          </form>
          <p id="transferResult" class="result-text"></p>
        </div>
      </div>

      <!-- Administración -->
      <div id="tab-admin" class="tab-panel hidden">
        <div class="card">
          <h3>Crear usuario</h3>
          <form id="createUserForm">
            <label>Usuario
              <input type="text" id="newUsername" required />
            </label>
            <label>Contraseña
              <input type="text" id="newPassword" required />
            </label>
            <label>Saldo inicial
              <input type="number" id="newInitialBalance" min="0" step="0.01" value="0" />
            </label>
            <button type="submit">Crear usuario</button>
          </form>
          <p id="createUserResult" class="result-text"></p>
        </div>

        <div class="card">
          <div class="card-header-row">
            <h3>Usuarios registrados</h3>
            <button id="refreshUsersBtn" class="btn-secondary">Actualizar lista</button>
          </div>
          <table class="data-table">
            <thead>
              <tr><th>Usuario</th><th>Rol</th><th>Saldo</th><th>Creado</th></tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>
      </div>

    </main>
  </section>

  <script src="/app.js"></script>
</body>
</html>
